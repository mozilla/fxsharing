{% extends "shares/base.html" %}
{% load static %}

{% block title %}Firefox Sharing{% endblock %}

{% block extra_css %}
  <link rel="stylesheet" href="{% static 'styles/landing.css' %}" />
{% endblock %}

{% block extra_scripts %}
  <script src="{% static 'components/moz-card/moz-card.mjs' %}" type="module"></script>
  <script src="{% static 'components/share-promo.mjs' %}" type="module"></script>
  <script src="{% static 'components/telemetry.mjs' %}" type="module"></script>
{% endblock %}

{% block content %}
  <moz-card>
    <share-promo
      class="callout"
      heading="Share a collection of links on any browser"
      message="Create a public page for links from Firefox. Share a folder, tab group, or selected tabs to get started."
    >
      <a slot="actions" class="cta-button fx-only" href="https://support.mozilla.org/kb/link-collections">Learn more</a>
      <a slot="actions" class="cta-button not-fx" data-event="cta_click" href="https://www.mozilla.org/firefox/?utm_source=link_sharing">Try Firefox</a>
    </share-promo>
  </moz-card>
{% endblock %}
